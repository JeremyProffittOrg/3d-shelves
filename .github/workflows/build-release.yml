name: Build and Release Bar Shelves

on:
  push:
    branches: [main]
    paths:
      - '**.scad'
      - '.github/workflows/build-release.yml'
      - 'build.sh'
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: latest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb

      - name: Create output directories
        run: |
          mkdir -p output/stl output/images

      - name: Generate STL files and previews
        run: |
          CAMERA_FRONT="0,0,0,55,0,45,0"
          CAMERA_REAR="0,0,0,55,0,225,0"
          IMG_SIZE="800,600"

          # Wrapper files only — bar_shelf.scad is the shared library.
          for scad_file in bar_shelf_*.scad; do
            base_name="${scad_file%.scad}"
            echo "=== Building $base_name ==="

            xvfb-run -a openscad -o "output/stl/${base_name}.stl" "$scad_file"

            xvfb-run -a openscad -o "output/images/${base_name}_front.png" \
              --camera=$CAMERA_FRONT --imgsize=$IMG_SIZE \
              --autocenter --viewall --colorscheme=Tomorrow "$scad_file"

            xvfb-run -a openscad -o "output/images/${base_name}_rear.png" \
              --camera=$CAMERA_REAR --imgsize=$IMG_SIZE \
              --autocenter --viewall --colorscheme=Tomorrow "$scad_file"
          done

      - name: List generated files
        run: |
          echo "=== STL Files ==="
          ls -la output/stl/
          echo
          echo "=== Image Files ==="
          ls -la output/images/

      - name: Delete existing release
        run: |
          gh release delete ${{ env.RELEASE_TAG }} --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create new release
        run: |
          RELEASE_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          cat > release_notes.md << EOF
          # Bar Shelves — 3D Printable Parts

          Generated on: $RELEASE_DATE

          ## Designs

          One-off shelves designed to fit over a bar, available in four widths:

          - **bar_shelf_100mm** — 100 mm wide
          - **bar_shelf_150mm** — 150 mm wide
          - **bar_shelf_200mm** — 200 mm wide
          - **bar_shelf_300mm** — 300 mm wide

          Each shelf has:
          - 150 mm depth × 10 mm thick top surface
          - 50 mm × 5 mm rear back wall (rounded top)
          - 3 × 2 mm front retaining ledge
          - Two drop walls underneath that straddle the bar
          - Three zip-tie channels under the shelf (10 mm from left, centered, 10 mm from right)

          ## Print Settings

          - **Material:** PLA or PETG
          - **Layer height:** 0.2 mm
          - **Infill:** 20–30 %
          - **Supports:** none required
          - **Orientation:** print with the shelf top facing down (drop walls pointing up)

          ---
          *Auto-generated by GitHub Actions*
          EOF

          gh release create ${{ env.RELEASE_TAG }} \
            --title "Bar Shelves — Latest Build" \
            --notes-file release_notes.md \
            --latest \
            output/stl/*.stl \
            output/images/*.png
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bar-shelves
          path: output/
          retention-days: 30
